<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeMentor AI</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>CodeMentor AI</h1>
            <p>Your single-agent programming mentor for learning and improving code.</p>
        </header>

        <section class="controls">
            <label id="languageLabel">
                Programming Language
                <select id="languageSelect">
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                </select>
            </label>

            <label>
                Feature
                <select id="modeSelect">
                    <option value="explain">Explain Code</option>
                    <option value="error_finder">Find Errors</option>
                    <option value="generate">Generate Code</option>
                    <option value="optimize">Optimize Code</option>
                    <option value="repo_report">Analyze Repository</option>
                </select>
            </label>
        </section>

        <section class="editor">
            <label for="inputText">Code or prompt</label>
            <textarea id="inputText" placeholder="Paste code or type your request here..."></textarea>
        </section>

        <button id="submitButton" type="button">Submit</button>

        <section class="output">
            <h2>AI Response</h2>
            <div id="outputText" class="response-content">
                <p class="placeholder">Your result will appear here.</p>
            </div>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
